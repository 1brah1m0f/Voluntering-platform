name: Email notifications

# Every day at 08:00 Baku time (04:00 UTC): free daily digests and reminders.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be sent, send nothing)'
        type: boolean
        default: true
      only:
        description: 'Only send to this email (optional, for testing)'
        required: false
      force_weekly:
        description: 'Treat today as the weekly (free) digest day'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Send notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: https://www.openlyapply.com
          NOTIFY_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: |
          args=()
          if [ "$NOTIFY_SCHEDULE" = "*/5 * * * *" ]; then args+=(--activation-only); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_ONLY" ]; then args+=("--only=$INPUT_ONLY"); fi
          if [ "$INPUT_FORCE_WEEKLY" = "true" ]; then args+=(--force-weekly); fi
          node jobs/notify.mjs "${args[@]}"
