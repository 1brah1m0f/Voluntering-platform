name: Scrape Opportunities

# Runs every day at 06:00 Baku time (02:00 UTC) to fetch new opportunities,
# filter for Azerbaijan, parse locally, and save dated calls as drafts in Supabase.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (crawl & parse without inserting to DB)'
        type: boolean
        default: false
      source:
        description: 'Source id from scraper/sources/catalog.json, or all'
        type: string
        default: all
      category:
        description: 'Collection category (use source=all with both)'
        type: choice
        options: [both, volunteering, hackathons]
        default: both
      scope:
        description: 'Source scope'
        type: choice
        options: [all, local, global]
        default: all
      limit:
        description: 'Maximum opportunities to crawl'
        type: number
        default: 5

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Test scraper rules
        run: python -m unittest discover -s scraper/tests

      - name: Run Scraper Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_SOURCE: ${{ inputs.source || 'all' }}
          INPUT_CATEGORY: ${{ inputs.category || 'both' }}
          INPUT_SCOPE: ${{ inputs.scope || 'all' }}
          INPUT_LIMIT: ${{ inputs.limit || 5 }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--source "$INPUT_SOURCE" --scope "$INPUT_SCOPE" --limit "$INPUT_LIMIT")
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_CATEGORY" = "both" ] && [ "$INPUT_SOURCE" != "all" ]; then
            echo "Select a single category when specifying a source id."
            exit 1
          fi
          if [ "$INPUT_CATEGORY" != "hackathons" ]; then
            python -u scrape.py --category volunteering "${args[@]}"
          fi
          if [ "$INPUT_CATEGORY" != "volunteering" ]; then
            python -u scrape.py --category hackathons "${args[@]}"
          fi

      - name: Upload collection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: volunteering-source-reports
          path: scraper/output/
          if-no-files-found: ignore
          retention-days: 14
