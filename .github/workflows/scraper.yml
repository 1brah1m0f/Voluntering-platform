name: Scrape Opportunities

# Runs every day at 06:00 Baku time (02:00 UTC) to fetch new opportunities,
# normalize them via Gemini AI, and save them as drafts in Supabase.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (crawl & parse without inserting to DB)'
        type: boolean
        default: false
      source:
        description: 'Source to scrape'
        type: choice
        options:
          - all
          - salto
          - youthop
        default: all
      limit:
        description: 'Maximum opportunities to crawl'
        type: number
        default: 15

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Scraper Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_SOURCE: ${{ inputs.source || 'salto' }}
          INPUT_LIMIT: ${{ inputs.limit || 15 }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--source "$INPUT_SOURCE" --limit "$INPUT_LIMIT")
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scraper/run.py "${args[@]}"
